name: CI

# Every pull request runs the checks that its changes can affect. The only required status is
# the `checks` job at the bottom. Scoping lives in job-level `if:` conditions, never in a
# workflow-level `paths` filter, so `checks` always reports.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every commit on main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.scope.outputs.core }}
      content: ${{ steps.scope.outputs.content }}
      tokens: ${{ steps.scope.outputs.tokens }}
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      # Two commits are enough: on a pull request HEAD is the merge commit, whose first
      # parent is the base tip. On main, HEAD^1 is the previous commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - id: scope
        run: .github/scripts/scope.sh "${{ github.event_name == 'workflow_dispatch' && 'full' || 'HEAD^1' }}"

  # Lint is repository-wide (ESLint and Prettier, which also covers the docs) and takes seconds,
  # so it runs on every change.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  core:
    name: core
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @getfreak/core typecheck
      - run: pnpm --filter @getfreak/core test

  content:
    name: content
    needs: scope
    if: needs.scope.outputs.content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @getfreak/content typecheck
      - run: pnpm --filter @getfreak/content test

  tokens:
    name: tokens
    needs: scope
    if: needs.scope.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @getfreak/tokens typecheck
      - run: pnpm --filter @getfreak/tokens test

  # The typecheck takes seconds, so it gets its own job instead of lengthening a test shard. It
  # runs once here and not in each shard.
  mobile-typecheck:
    name: mobile typecheck
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @getfreak/mobile typecheck

  # The mobile suites take about 8 minutes on one runner, so Jest splits them across five. Each
  # shard runs a fifth of the test files. Five, not four, because the slowest of four shards was
  # estimated at about 3.5 minutes and the slowest of five at under 3. Six gained almost nothing.
  # `fail-fast` is off so that one failing shard does not cancel the others, and every failure
  # shows in a single run.
  mobile:
    name: mobile (${{ matrix.shard }}/5)
    needs: scope
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @getfreak/mobile run test --shard=${{ matrix.shard }}/5

  # Runs only on a full run started by hand, so it adds no cost per push. It bundles the Android
  # release the way Gradle does: the Expo CLI under plain node, without pnpm's shim, which would
  # put the hidden hoist on NODE_PATH. A package that apps/mobile uses but does not declare
  # resolves through that hoist, so only this run can catch it (FRK-24).
  release-bundle:
    name: release-bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Bundle the Android release
        working-directory: apps/mobile
        run: |
          env -u NODE_PATH NODE_ENV=production node "$(node -p "require.resolve('expo/bin/cli')")" export:embed \
            --reset-cache \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output "${{ runner.temp }}/release-bundle/index.android.bundle" \
            --assets-dest "${{ runner.temp }}/release-bundle"

  # The single required status. It fails if any job failed or was cancelled, and passes when
  # every job succeeded or was skipped.
  checks:
    name: checks
    needs: [scope, lint, core, content, tokens, mobile-typecheck, mobile, release-bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Report success
        run: echo "All jobs passed or were skipped."
